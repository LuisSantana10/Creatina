<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creatina</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
:root{--head:"Sora","DM Sans",-apple-system,system-ui,sans-serif;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--ink:#fff;--soft:#e8f1fd;--line:#d2d2d7;--ok:#248a3d;--err:#d70015;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--accent:#0a84ff;--ink:#fff;--soft:#0c2a4a;--line:#38383a;--ok:#30d158;--err:#ff453a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--accent:#0a84ff;--ink:#fff;--soft:#0c2a4a;--line:#38383a;--ok:#30d158;--err:#ff453a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
[hidden]{display:none!important}
main{position:relative;max-width:980px;margin:0 auto;padding:36px max(20px,env(safe-area-inset-right)) 56px max(20px,env(safe-area-inset-left))}
h1{margin:0;padding-right:52px;font-family:var(--head);font-size:clamp(2.1rem,7vw,3.5rem);line-height:1.08;font-weight:700;letter-spacing:-.03em;min-height:1.1em}
h1.done{color:var(--ok)}
.sub{margin:8px 0 0;color:var(--muted);font-size:1.1rem}
.user{position:absolute;top:10px;right:max(14px,env(safe-area-inset-right))}
.me{width:44px;height:44px;border:0;background:none;color:var(--text);display:grid;place-items:center;cursor:pointer;border-radius:50%;padding:0}
.me svg{width:28px;height:28px}
.me:active{opacity:.6}
.pop{position:absolute;top:50px;right:0;width:260px;background:var(--card);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:5}
.pop strong{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.pop p{margin:2px 0 14px;color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.pop .go{height:48px;font-size:1rem}
.guest{margin-top:32px}
.guest .go{max-width:360px}
.layout{display:grid;gap:20px;margin-top:32px}
@media (min-width:860px){.layout{grid-template-columns:1.25fr 1fr;align-items:start}}
.card{background:var(--card);border-radius:28px;padding:24px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h2{margin:0;font-family:var(--head);font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.head h2{text-transform:capitalize}
.nav{display:flex;gap:8px}
.nav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--text);font-size:1.3rem;line-height:1;cursor:pointer;transition:transform .15s}
.nav button:active{transform:scale(.92)}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd{font-size:.8rem;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:.95rem;line-height:1.1}
.day small{font-size:.62rem;opacity:.85}
.day.on{background:var(--accent);color:var(--ink);font-weight:600}
.day.today{outline:2px solid var(--accent);outline-offset:2px}
.day.future{color:var(--muted);opacity:.4}
.label{margin:18px 0 8px;color:var(--muted);font-size:.95rem}
.doses{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.doses button{height:48px;border-radius:14px;border:0;background:var(--bg);color:var(--text);font-weight:600;cursor:pointer;transition:transform .15s,background .2s}
.doses button:active:not(:disabled){transform:scale(.95)}
.doses button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.doses button:disabled{cursor:not-allowed}
.doses button:disabled:not([aria-pressed="true"]){opacity:.4}
.check{display:flex;gap:12px;align-items:center;margin:18px 0 16px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.err{margin:0 0 12px;color:var(--err);font-size:.95rem;min-height:0}
.go{width:100%;height:56px;border:0;border-radius:980px;background:var(--accent);color:var(--ink);font-size:1.1rem;font-weight:600;cursor:pointer;transition:transform .15s,background .2s}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.6;cursor:wait}
.go.done{background:var(--soft);color:var(--accent)}
.go.out{background:var(--bg);color:var(--text)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="user" hidden>
    <button class="me" id="me" type="button" aria-label="Conta" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
    <div class="pop" id="pop" role="dialog" aria-label="Conta" hidden></div>
  </div>
  <h1 id="status"></h1>
  <p class="sub" id="sub"></p>
  <div class="guest" id="guest" hidden>
    <button class="go" id="login" type="button">Entrar com Google</button>
  </div>
  <div class="layout" id="app" hidden>
    <section class="card" aria-label="Calendário">
      <div class="head">
        <h2 id="mname"></h2>
        <div class="nav"><button id="prev" type="button" aria-label="Mês anterior">&lsaquo;</button><button id="next" type="button" aria-label="Próximo mês">&rsaquo;</button></div>
      </div>
      <div class="grid" id="cal"></div>
    </section>
    <section class="card" aria-label="Marcar hoje">
      <h2>Marcar hoje.</h2>
      <p class="label">Quantidade</p>
      <div class="doses" id="doses"></div>
      <label class="check"><input type="checkbox" id="fix"><span>Usar sempre esta quantidade</span></label>
      <p class="err" id="err" role="alert"></p>
      <button class="go" id="go" type="button"></button>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL='https://ezlvtbjxmuqkqraglkvt.supabase.co';
  var SUPABASE_KEY='sb_publishable_lkXRSQL8lrTLDmSZL1HQSA_hNye046s';
  var db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce'}});
  var pad=function(n){return String(n).padStart(2,'0')};
  var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  var $=function(id){return document.getElementById(id)};
  var user=null, ready=false, busy=false, currentId=null, state={days:{},def:null}, sel=null;
  var first=new Date(); var view=new Date(first.getFullYear(),first.getMonth(),1);

  var dosesEl=$('doses');
  for(var n=1;n<=5;n++){
    (function(n){
      var b=document.createElement('button');
      b.type='button'; b.textContent=n+' g'; b.dataset.g=n;
      b.addEventListener('click',function(){sel=n;render();});
      dosesEl.appendChild(b);
    })(n);
  }

  function setErr(m){$('err').textContent=m||'';}
  function closePop(){$('pop').hidden=true;$('me').setAttribute('aria-expanded','false');}
  function run(fn){
    if(busy) return;
    busy=true; setErr(''); render();
    Promise.resolve().then(fn).catch(function(){setErr('Não foi possível salvar. Confira a conexão e tente de novo.');}).then(function(){busy=false;render();});
  }
  function check(r){if(r.error) throw r.error;}

  async function loadData(){
    var d=await db.from('doses_tomadas').select('dia,gramas').order('dia',{ascending:false}).limit(1000);
    var c=await db.from('configuracoes').select('dose_padrao').maybeSingle();
    check(d); check(c);
    state={days:{},def:c.data?c.data.dose_padrao:null};
    d.data.forEach(function(r){state.days[r.dia]={g:r.gramas};});
  }

  db.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){
      var u=session&&session.user?session.user:null, id=u?u.id:null;
      if(ready&&id===currentId){user=u;return;}
      currentId=id; user=u; state={days:{},def:null}; sel=null; closePop(); setErr('');
      if(!u){ready=true;render();return;}
      loadData().catch(function(){setErr('Não foi possível carregar os seus dias.');}).then(function(){
        sel=state.def; ready=true; render();
        if(location.search.indexOf('code=')>-1) history.replaceState(null,'',location.pathname);
      });
    },0);
  });

  $('login').addEventListener('click',function(){
    db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  });
  $('me').addEventListener('click',function(e){
    e.stopPropagation(); var p=$('pop');
    if(p.hidden){
      p.innerHTML='<strong></strong><p></p><button class="go out" id="out" type="button">Sair</button>';
      var m=user.user_metadata||{};
      p.querySelector('strong').textContent=m.full_name||m.name||user.email;
      p.querySelector('p').textContent=user.email;
      $('out').onclick=function(){db.auth.signOut();};
    }
    p.hidden=!p.hidden; this.setAttribute('aria-expanded',String(!p.hidden));
  });
  document.addEventListener('click',function(e){if(!$('pop').hidden&&!$('pop').contains(e.target)) closePop();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') closePop();});

  $('fix').addEventListener('change',function(e){
    var v=e.target.checked?sel:null;
    run(async function(){
      check(await db.from('configuracoes').upsert({user_id:user.id,dose_padrao:v}));
      state.def=v;
    });
  });
  $('go').addEventListener('click',function(){
    var T=ymd(new Date());
    run(async function(){
      if(state.days[T]){
        check(await db.from('doses_tomadas').delete().eq('dia',T));
        delete state.days[T];
      }else{
        check(await db.from('doses_tomadas').upsert({user_id:user.id,dia:T,gramas:sel}));
        state.days[T]={g:sel};
      }
    });
  });
  $('prev').addEventListener('click',function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();});
  $('next').addEventListener('click',function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();});

  function render(){
    var now=new Date(), T=ymd(now), h1=$('status');
    document.querySelector('.user').hidden=!(ready&&user);
    $('app').hidden=!(ready&&user); $('guest').hidden=!(ready&&!user);
    if(!ready){h1.className='';h1.textContent='';$('sub').textContent='';return;}
    if(!user){
      h1.className=''; h1.textContent='Entre para começar.';
      $('sub').textContent='Conecte-se para acompanhar os seus dias.';
      return;
    }
    var rec=state.days[T], done=!!rec;
    var g=done?rec.g:sel, locked=done||state.def!=null||busy;
    h1.className=done?'done':'';
    h1.textContent=done?'Já tomou hoje.':'Ainda não tomou hoje.';
    var dt=now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    $('sub').textContent=dt.charAt(0).toUpperCase()+dt.slice(1)+'.'+(done?(g?' Marcado com '+g+' g.':' Marcado sem quantidade.'):'');
    var go=$('go'); go.className='go'+(done?' done':''); go.textContent=done?'Desmarcar hoje':'Tomei hoje'; go.disabled=busy;
    Array.prototype.forEach.call(dosesEl.children,function(b){
      b.setAttribute('aria-pressed',String(Number(b.dataset.g)===g)); b.disabled=locked;
    });
    var fix=$('fix'); fix.checked=state.def!=null; fix.disabled=busy||done||(state.def==null&&sel==null);
    var y=view.getFullYear(), m=view.getMonth();
    $('mname').textContent=view.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    $('next').disabled=(y===now.getFullYear()&&m===now.getMonth());
    var html='';
    ['D','S','T','Q','Q','S','S'].forEach(function(w){html+='<div class="wd">'+w+'</div>';});
    for(var i=0;i<new Date(y,m,1).getDay();i++) html+='<div></div>';
    for(var d=1;d<=new Date(y,m+1,0).getDate();d++){
      var key=y+'-'+pad(m+1)+'-'+pad(d), r=state.days[key];
      var cls='day'+(r?' on':'')+(key===T?' today':'')+(key>T?' future':'');
      html+='<div class="'+cls+'">'+d+(r&&r.g?'<small>'+r.g+'g</small>':'')+'</div>';
    }
    $('cal').innerHTML=html;
  }
  render();
})();
</script>
</body>
</html>
